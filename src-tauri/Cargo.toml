[package]
name = "protonmail-client"
version = "0.1.0"
edition = "2021"
description = "Desktop email client for ProtonMail via hydroxide"

[lib]
name = "protonmail_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "protonmail-client"
path = "src/main.rs"

[[bin]]
name = "pm-cli"
path = "src/bin/cli.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-keyring = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
async-imap = "0.10"
async-native-tls = "0.5"
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.9"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
